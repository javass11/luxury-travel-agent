<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Travel Deal Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #d4af37, #f0e68c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.2em;
            color: #a0a0a0;
            font-style: italic;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9em;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            padding: 12px 16px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        button {
            grid-column: 1 / -1;
            padding: 16px 40px;
            background: linear-gradient(45deg, #d4af37, #f0e68c);
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
        }

        .deals-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .deal-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .deal-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .deal-type {
            color: #d4af37;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .deal-title {
            font-size: 1.4em;
            margin-bottom: 15px;
            color: #f0e68c;
        }

        .deal-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .detail-label {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .detail-value {
            color: #e0e0e0;
            font-weight: 600;
        }

        .cpp-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.2);
            color: #f0e68c;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
            margin-top: 10px;
        }

        .error {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid rgba(255, 77, 77, 0.5);
            color: #ff9999;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .summary {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .summary h2 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .deals-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .search-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Luxury Travel Deal Finder</h1>
            <p class="tagline">Discover Premium Flights & Hotels at Unbeatable Redemption Values</p>
        </header>

        <div class="search-section">
            <form id="searchForm">
                <div class="search-grid">
                    <div class="form-group">
                        <label for="origin">From</label>
                        <input type="text" id="origin" placeholder="Airport Code (e.g., ORD)" value="ORD" required>
                    </div>
                    <div class="form-group">
                        <label for="destination">To</label>
                        <input type="text" id="destination" placeholder="Airport Code (e.g., MIA)" value="MIA" required>
                    </div>
                    <div class="form-group">
                        <label for="departure">Departure Date</label>
                        <input type="date" id="departure" required>
                    </div>
                    <div class="form-group">
                        <label for="cabin">Cabin Class</label>
                        <select id="cabin">
                            <option value="Economy">Economy</option>
                            <option value="Business" selected>Business</option>
                            <option value="First">First</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="checkout">Hotel Checkout</label>
                        <input type="date" id="checkout">
                    </div>
                    <button type="submit">🔍 Find Premium Deals</button>
                </div>
            </form>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Searching for the best deals...</p>
        </div>

        <div id="results" class="results-section"></div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('departure').valueAsDate = new Date();

        const checkoutDate = new Date();
        checkoutDate.setDate(checkoutDate.getDate() + 7);
        document.getElementById('checkout').valueAsDate = checkoutDate;

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const origin = document.getElementById('origin').value.toUpperCase();
            const destination = document.getElementById('destination').value.toUpperCase();
            const departure = document.getElementById('departure').value;
            const cabin = document.getElementById('cabin').value;
            const checkout = document.getElementById('checkout').value;

            if (!origin || !destination || !departure) {
                alert('Please fill in all required fields');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch('/api/deals/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        origin,
                        destination,
                        departure_date: departure,
                        hotel_destination: destination,
                        checkin: departure,
                        checkout,
                        cabin_class: cabin
                    })
                });

                if (!response.ok) throw new Error('Search failed');
                const data = await response.json();

                displayResults(data);
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}. Please check your input and try again.
                    </div>
                `;
                document.getElementById('results').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.className = 'results-section';
            resultsDiv.style.display = 'block';

            let html = '<div class="deals-container">';

            if (data.flights && data.flights.length > 0) {
                data.flights.forEach(flight => {
                    html += `
                        <div class="deal-card">
                            <div class="deal-type">✈️ Flight</div>
                            <div class="deal-title">${flight.airline} - ${flight.cabin_class}</div>
                            <div class="deal-detail">
                                <span class="detail-label">Route</span>
                                <span class="detail-value">${flight.origin} → ${flight.destination}</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Cash Price</span>
                                <span class="detail-value">$${flight.cash_price.toLocaleString()}</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Miles Cost</span>
                                <span class="detail-value">${flight.miles_cost.toLocaleString()}</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Date</span>
                                <span class="detail-value">${flight.departure_date}</span>
                            </div>
                            <span class="cpp-badge">CPP: ${flight.cpp.toFixed(2)}¢</span>
                        </div>
                    `;
                });
            }

            if (data.hotels && data.hotels.length > 0) {
                data.hotels.forEach(hotel => {
                    html += `
                        <div class="deal-card">
                            <div class="deal-type">🏨 Hotel</div>
                            <div class="deal-title">${hotel.name}</div>
                            <div class="deal-detail">
                                <span class="detail-label">Location</span>
                                <span class="detail-value">${hotel.destination}</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Cash Rate</span>
                                <span class="detail-value">$${hotel.cash_rate.toLocaleString()}/night</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Points Cost</span>
                                <span class="detail-value">${hotel.points_cost.toLocaleString()}</span>
                            </div>
                            <div class="deal-detail">
                                <span class="detail-label">Program</span>
                                <span class="detail-value">${hotel.loyalty_program}</span>
                            </div>
                            ${hotel.suite_upgrade_available ? '<div class="deal-detail"><span class="detail-label">Suite Upgrade</span><span class="detail-value">✓ Available</span></div>' : ''}
                            <span class="cpp-badge">CPP: ${hotel.cpp.toFixed(2)}¢</span>
                        </div>
                    `;
                });
            }

            html += '</div>';

            if (data.summary) {
                html += `
                    <div class="summary">
                        <h2>Summary</h2>
                        <div class="summary-item">
                            <span>Flights Found</span>
                            <strong>${data.summary.flight_count}</strong>
                        </div>
                        <div class="summary-item">
                            <span>Hotels Found</span>
                            <strong>${data.summary.hotel_count}</strong>
                        </div>
                        ${data.summary.best_flight_cpp ? `
                        <div class="summary-item">
                            <span>Best Flight CPP</span>
                            <strong>${data.summary.best_flight_cpp.toFixed(2)}¢</strong>
                        </div>
                        ` : ''}
                        ${data.summary.best_hotel_cpp ? `
                        <div class="summary-item">
                            <span>Best Hotel CPP</span>
                            <strong>${data.summary.best_hotel_cpp.toFixed(2)}¢</strong>
                        </div>
                        ` : ''}
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
